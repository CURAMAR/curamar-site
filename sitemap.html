<style>
  :root{
    --bg:#0d1014;--bg-soft:#141a21;--bg-line:#1f2730;
    --ink:#e8edf2;--ink-dim:#8a97a5;
    --accent:#c8f542;--accent-cool:#5cc8ff;
    --radius:14px;--maxw:820px;
    --font-disp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
    --font-body:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    --font-mono:"SFMono-Regular",Consolas,"Courier New",monospace;
  }
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.9;-webkit-font-smoothing:antialiased}
  a{color:var(--accent-cool)}
  .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
    background-image:linear-gradient(var(--bg-line) 1px,transparent 1px),linear-gradient(90deg,var(--bg-line) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse 80% 50% at 50% 0%,#000 20%,transparent 70%);
    -webkit-mask-image:radial-gradient(ellipse 80% 50% at 50% 0%,#000 20%,transparent 70%)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;position:relative;z-index:1}

  header{position:sticky;top:0;z-index:50;background:rgba(13,16,20,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--bg-line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:62px}
  .logo{font-family:var(--font-mono);font-weight:700;letter-spacing:.05em;font-size:18px}
  .logo .cura{color:var(--accent)}.logo .mar{color:var(--accent-cool)}
  .back{font-size:14px;color:var(--ink-dim)}
  .back:hover{color:var(--ink)}

  article{padding:56px 0 40px}
  .doc-eyebrow{font-family:var(--font-mono);font-size:13px;color:var(--accent-cool);letter-spacing:.16em;display:inline-flex;align-items:center;gap:10px;margin-bottom:16px}
  .doc-eyebrow::before{content:"";width:28px;height:1px;background:var(--accent-cool)}
  h1{font-family:var(--font-disp);font-size:clamp(26px,5vw,38px);font-weight:700;margin-bottom:10px}
  h1 .hl{color:var(--accent)}

  .lead{font-size:16px;color:var(--ink-dim);background:var(--bg-soft);border:1px solid var(--bg-line);border-radius:var(--radius);padding:20px 22px;margin:22px 0 40px}

  h2{font-family:var(--font-disp);font-size:21px;font-weight:700;margin:44px 0 16px;padding-left:14px;border-left:3px solid var(--accent)}
  p{margin-bottom:18px}
  ul{margin:0 0 18px 22px}
  li{margin-bottom:9px}
  strong{color:var(--ink)}
  .accent-box{border-left:3px solid var(--accent-cool);background:var(--bg-soft);padding:16px 20px;border-radius:0 10px 10px 0;margin-bottom:18px;color:var(--ink-dim)}
  .note{background:var(--bg-soft);border:1px solid var(--bg-line);border-radius:10px;padding:16px 18px;font-size:14px;color:var(--ink-dim);margin-bottom:18px}
  .warn{border-left:3px solid #ff6b6b;background:rgba(255,107,107,.07);padding:16px 20px;border-radius:0 10px 10px 0;margin-bottom:18px}
  .give-row{display:flex;gap:14px;flex-wrap:wrap;margin:26px 0 8px}
  .give{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#0d1014;font-weight:700;font-size:15px;
    padding:13px 26px;border-radius:10px;transition:transform .15s,box-shadow .2s}
  .give:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(200,245,66,.25)}
  .give.ghost{background:transparent;color:var(--ink);border:1px solid var(--bg-line)}
  .give.ghost:hover{border-color:var(--accent);box-shadow:none}
  code{font-family:var(--font-mono);font-size:.92em;background:var(--bg-soft);border:1px solid var(--bg-line);border-radius:5px;padding:1px 6px}

  footer{border-top:1px solid var(--bg-line);padding:34px 0;margin-top:40px}
  .foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
  .foot .links{display:flex;gap:18px;font-size:14px;flex-wrap:wrap}
  .foot .links a{color:var(--ink-dim)}.foot .links a:hover{color:var(--accent)}
  .foot .cp{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim)}

  .scm-inline .scm-group h3{font-size:14px}
  .nojs{background:var(--bg-soft);border:1px solid var(--bg-line);border-radius:10px;padding:14px 16px;font-size:14px;color:var(--ink-dim)}
  .nojs a{color:var(--accent-cool)}
</style>
